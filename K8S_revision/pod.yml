kind: Pod
apiVersion: v1
metadata:
  name: nginx-pod
  labels:
    app: nginx
    type: frontend
spec:
  containers:
  - name: nginx-ccontainer
    image: nginx:latest
    ports:
    - containerPort: 80
    tolerations:
    - key: gpu
      operator: Equal
      value: true
      effect: NoSchedule
  
