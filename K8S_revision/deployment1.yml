kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  labels:
    app: nginx-app
    env: dev
spec:
  selector:
    matchLabels:
      app: nginx-app-pod
      env: dev
  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx-app-pod
        env: dev
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
  replicas: 3
