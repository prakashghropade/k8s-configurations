kind: Pod
apiVersion: v1
metadata:
  name: secretes
  labels:
    app: nginx-app
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    env:
    - name: FIRSTNAME
      valueFrom:
        secreteKeyRef:
          name: app-secret
          key: username
    command: ['sh', '-c', 'echo This app is running && sleep 3600']

