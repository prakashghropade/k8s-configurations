kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  labels:
    env: dev
    app: nginx-deployment
spec:
  selector:
    matchLabels:
      app: nginx-app
      env: dev
  template:
    metadata:
      name: nginx-dop-app
      labels:
        app: nginx-app
        env: dev
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.29
          ports:
            - containerPort: 80
  replicas: 3